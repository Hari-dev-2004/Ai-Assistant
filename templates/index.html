<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced AI Robot</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #C4E0E5, #4CA1AF);
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative; /* Added to place the logo and response properly */
        }

        /* Eris AI Logo */
        .eris-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            background-color: #fff;
            padding: 5px 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
        }

        /* Robot Container */
        .robot {
            position: relative;
            width: 300px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-10px);
            animation: float 3s ease-in-out infinite;
            z-index: 1;
        }

        /* Robot Head */
        .robot-head {
            width: 180px;
            height: 120px;
            background: #FFFFFF;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: -4px -4px 8px #ffffff, 4px 4px 12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin-bottom: 15px; /* Gap between head and body */
        }

        /* Face with Glowing Eyes */
        .robot-face {
            width: 140px;
            height: 70px;
            background: #333;
            border-radius: 20px;
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.3);
        }

        .robot-eye {
            width: 15px;
            height: 15px;
            background: #00e6ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e6ff, 0 0 15px #00e6ff;
            animation: blink 2s infinite;
        }

        /* Separated Arms */
        .robot-arm {
            width: 35px;
            height: 35px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 55%;
            transform: translateY(-50%);
            box-shadow: -2px -2px 4px #ffffff, 2px 2px 6px rgba(0, 0, 0, 0.2);
            animation: armBounce 2s ease-in-out infinite;
        }

        .robot-arm.left {
            left: -45px;
        }

        .robot-arm.right {
            right: -45px;
        }

        /* Robot Body */
        .robot-body {
            width: 140px;
            height: 180px;
            background: #ffffff;
            border-radius: 50px 50px 30px 30px;
            box-shadow: -4px -4px 10px #ffffff, 4px 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Assistant Response Cloud */
        .response-cloud {
            position: absolute;
            top: -50px;
            right: -70px; /* Correctly placed at the top-right */
            width: 200px;
            padding: 15px 20px;
            background: #FFFFFF;
            color: #333;
            font-size: 14px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            opacity: 0;
            animation: cloudAppear 2s 0.5s forwards;
        }

        .response-cloud::after {
            content: "";
            position: absolute;
            top: 50%;
            left: -10px;
            transform: translateY(-50%);
            width: 20px;
            height: 10px;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0px -2px 6px rgba(0, 0, 0, 0.15);
        }

        /* User Query Box */
        .user-query {
            position: absolute;
            bottom: -60px;
            width: 280px;
            padding: 10px;
            background: #FFFFFF;
            color: #333;
            font-size: 14px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Animation Keyframes */
        @keyframes blink {
            0%, 90%, 95%, 100% { height: 15px; }
            92%, 94% { height: 3px; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(-10px); }
            50% { transform: translateY(0); }
        }

        @keyframes armBounce {
            0%, 100% { transform: translateY(-50%); }
            50% { transform: translateY(-55%); }
        }

        @keyframes cloudAppear {
            from { opacity: 0; transform: translateX(50%) scale(0.8); }
            to { opacity: 1; transform: translateX(50%) scale(1); }
        }
    </style>
</head>
<body>
    <!-- Eris AI Logo -->
    <div class="eris-logo">Eris AI</div>

    <div class="robot" id="robot">
        <!-- Robot Head -->
        <div class="robot-head">
            <div class="robot-face">
                <div class="robot-eye"></div>
                <div class="robot-eye"></div>
            </div>
        </div>
        
        <!-- Robot Body -->
        <div class="robot-body">
            <div class="robot-arm left"></div>
            <div class="robot-arm right"></div>
        </div>
        
        <!-- Assistant Response Cloud -->
        <div id="assistant-response" class="response-cloud">Hello there!</div>
        
        <!-- User Query Box -->
        <div id="user-query" class="user-query">Your question here...</div>
    </div>

    <!-- Background music element -->
    <audio id="bgm" src="{{url_for('static', filename='bgm.mp3')}}"></audio>

    <script>
        let lastUserQuery = ""; // To store the last query for comparison

        async function fetchConversation() {
            try {
                const response = await fetch('/get_conversation');
                const data = await response.json();
                
                // Update display for assistant response
                document.getElementById('assistant-response').innerText = data.assistant_response || "Hello there!";
                
                // Check if user query has changed
                if (data.user_query && data.user_query !== lastUserQuery) {
                    document.getElementById('user-query').innerText = data.user_query;
                    playBGM(); // Play BGM only when there's a change in user query
                    lastUserQuery = data.user_query; // Update last query
                }
            } catch (error) {
                console.error('Error fetching conversation:', error);
            }
        }

        function playBGM() {
            const bgm = document.getElementById('bgm');
            bgm.play();
        }

        setInterval(fetchConversation, 2000);
    </script>
</body>
</html>
